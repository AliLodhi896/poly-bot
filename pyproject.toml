[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket liquidity-rewards market-making bot with risk-managed post-fill handling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.7.4",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
live = [
    "py-clob-client-v2",
]

[project.scripts]
polybot = "polybot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on Depends/Query/Header/etc. in argument
# defaults — the framework's intended pattern, so exempt them from B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
